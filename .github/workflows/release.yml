name: Publish release

on:
  push:
    branches:
      - 'publish/v[0-9]*'
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !github.event.deleted && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/publish/v')) }}
    runs-on: ubuntu-latest
    concurrency: publish-cycles-frame-pipeline
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Select the source tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME#publish/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
      - name: Package the extension and corresponding project sources
        run: |
          set -euo pipefail
          version=$(python3 -c 'from pathlib import Path; import tomllib; print(tomllib.loads(Path("extension/blender_manifest.toml").read_text())["version"])')
          test "$TAG" = "v$version"
          python3 tools/package.py
      - name: Publish tested packages and retire the staged overlay
        run: |
          set -euo pipefail
          version="${TAG#v}"
          ref="refs/heads/release-input/$TAG"
          overlay="cycles-frame-pipeline-windows-x64-$version.zip"
          assets=("$overlay" "cycles_frame_pipeline-$version-en.zip"
                  "cycles_frame_pipeline-$version-zh-CN.zip" "cycles_frame_pipeline-source-$version.zip")
          input=$(git ls-remote --refs origin "$ref" | cut -f1)
          if [[ -n "$input" ]]; then
            git fetch --no-tags --depth=1 origin "$ref"
            input=$(git rev-parse FETCH_HEAD)
            git show "$input:$overlay" > "dist/$overlay"
            (cd dist && sha256sum -c ../release/windows-overlay.sha256)
          fi

          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$draft" != false ]]; then
            test -n "$input"
            title=$(sed -n '1s/^# //p' release/notes.md)
            test -n "$title"
            if [[ -z "$draft" ]]; then
              gh release create "$TAG" --draft --verify-tag --title "$title" --notes-file release/notes.md
            fi
            (cd dist && gh release upload "$TAG" "${assets[@]}" --clobber)
            gh release edit "$TAG" --draft=false --latest --title "$title" --notes-file release/notes.md
          fi

          published=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          for asset in "${assets[@]}"; do
            jq -e --arg name "$asset" '.draft == false and any(.assets[]; .name == $name and .state == "uploaded")' <<<"$published" >/dev/null
          done
          digest="sha256:$(cut -d' ' -f1 release/windows-overlay.sha256)"
          jq -e --arg name "$overlay" --arg digest "$digest" 'any(.assets[]; .name == $name and .digest == $digest)' <<<"$published" >/dev/null
          if [[ -n "$input" ]]; then
            git push --force-with-lease="$ref:$input" origin ":$ref"
          fi

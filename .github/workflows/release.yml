name: Publish release

on:
  push:
    branches:
      - 'publish/v[0-9]*'
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !github.event.deleted && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/publish/v')) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Select the source tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME#publish/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
      - name: Package the extension and corresponding project sources
        run: |
          set -euo pipefail
          version=$(python3 -c 'from pathlib import Path; import tomllib; print(tomllib.loads(Path("extension/blender_manifest.toml").read_text())["version"])')
          test "$TAG" = "v$version"
          python3 tools/package.py
      - name: Retrieve both tested Windows overlays and verify their digests
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/heads/release-input/$TAG"
          for lang in en zh-CN; do
            name="cycles-frame-pipeline-windows-x64-${TAG#v}-$lang.zip"
            git show "FETCH_HEAD:$name" > "dist/$name"
            test -f "dist/cycles_frame_pipeline-${TAG#v}-$lang.zip"
          done
          (cd dist && sha256sum -c ../release/windows-overlay.sha256)
      - name: Publish the language-specific packages and common source archive
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/*.zip --verify-tag --title "Cycles Frame Pipeline $TAG" --notes-file release/notes.md
